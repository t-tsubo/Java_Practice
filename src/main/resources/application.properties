spring.application.name=qiita-summary-notifier

# ログの出力レベルをDEBUGにする
logging.level.com.portfolio.qiita_summary_notifier=DEBUG

# コンソール出力時の文字コードをUTF-8に指定
logging.charset.console=UTF-8

# application-local.propertiesを読み込む
spring.profiles.include=local

